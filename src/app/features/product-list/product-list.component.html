<div class="container">
    <h2 class="section-title">Featured Products</h2>
    <div class="row">
        <!-- Product Card 1 -->
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let product of products">
            <div class="product-card">
                <div class="product-image">
                    <img src="{{product.image}}" alt="{{product.name}}" (error)="onImageError($event)">
                    <div class="wishlist" (click)="toggleWishlist(product)">
                        <i [ngClass]="wishlist.includes(product.id) ? 'fas fa-heart' : 'far fa-heart'"></i>
                      </div>
                      
                </div>
                <div class="product-details">
                    <app-rating [rating]="product.rating"></app-rating>
                    <h3 class="product-name">{{product.name}}</h3>
                    <p class="product-description">{{product.description}}</p>
                    <div class="price-cart">
                        <div class="price">
                            <span class="current-price">{{product.currentPrice | currency:'₹ '}}</span>
                            <span class="original-price">{{product.originalPrice | currency:'₹ '}}</span>
                        </div>
                        <button class="add-to-cart" (click)="addToCart(product)">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        
    </div>
</div>
